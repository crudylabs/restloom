# Builds every package and runs the unit tests and the conformance suite
# against Postgres, MySQL and SQLite. SQL Server runs locally only: its
# image needs its licence accepted, which stays the maintainer's decision. The organisation only allows its own actions, so
# checkout and Node setup are plain shell; databases are service containers.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: v24.22.2
      RESTLOOM_PG_URL: postgres://postgres@localhost:5432/postgres
      RESTLOOM_MYSQL_URL: mysql://root@127.0.0.1:3306
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot" --health-interval 3s --health-timeout 3s --health-retries 40
    steps:
      - name: Check out
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install Node
        run: |
          base="https://nodejs.org/dist/$NODE_VERSION"
          file="node-$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$file" -C "$RUNNER_TEMP/node" --strip-components=1
          rm "$file"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - run: npm test
