# Stages every @crudy/restloom* package to npmjs on version tags
# (v<major>.<minor>.<patch>) through npm trusted publishing: GitHub's OIDC
# token stands in for an npm token, and npm attaches a provenance statement
# naming this repository and commit. A staged version goes live once a
# maintainer approves it with 2FA (npm stage approve, or npmjs.com). The
# organisation only allows its own actions, so checkout and Node setup are
# plain shell. The core goes first: every other package depends on it.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: v24.22.2
    steps:
      - name: Check out the tag
        run: |
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $GITHUB_REF_NAME" >&2; exit 1 ;; esac
          git init -q .
          git fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git checkout -q "refs/tags/$GITHUB_REF_NAME"
      - name: Install Node
        run: |
          base="https://nodejs.org/dist/$NODE_VERSION"
          file="node-$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$file" -C "$RUNNER_TEMP/node" --strip-components=1
          rm "$file"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Install npm with staged publishing
        run: npm install -g npm@11.21.1
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Publish
        run: |
          for dir in core postgres mysql mssql sqlite fastify express; do
            NAME=$(node -p "require('./packages/$dir/package.json').name")
            VERSION=$(node -p "require('./packages/$dir/package.json').version")
            [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match $NAME $VERSION" >&2; exit 1; }
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is already published"
            else
              (cd "packages/$dir" && npm stage publish)
            fi
          done
